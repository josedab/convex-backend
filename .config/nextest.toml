# Nextest configuration for Convex Backend
#
# Test Reliability Notes:
# - All tests should be deterministic and pass reliably
# - Flaky tests should be fixed rather than retried
# - Ignored tests are either integration tests (require credentials/resources)
#   or performance benchmarks
#
# To run integration tests with external dependencies:
#   cargo nextest run --ignored
#
# For more information on test reliability improvements, see:
# RFC-0004: Test Reliability Program

[profile.ci.junit]
path = "junit.xml"

[profile.ci]
# Don't fail fast in CI to get full test results
fail-fast = false
# Show failures immediately and at the end
failure-output = "immediate-final"
# No retries - tests should be reliable
retries = 0

# Profile for local development - stricter settings
[profile.local]
fail-fast = true
failure-output = "immediate-final"
retries = 0

[[profile.ci.overrides]]
filter = 'test(/model::tests::model_tests::/)'
test-group = 'model-tests'

[[profile.ci.overrides]]
filter = 'test(/roundtrips/) or test(/proptest/)'
test-group = 'proptests'

# Integration tests group - for tests that require external resources
[[profile.ci.overrides]]
filter = 'test(/test_parallel_upload/) or test(/test_sequential_upload/) or test(/test_abort/) or test(/test_signed_url/)'
test-group = 'integration-tests'

[test-groups]
model-tests = { max-threads = 4 }
proptests = { max-threads = 4 }
# Integration tests run with limited concurrency to avoid resource contention
integration-tests = { max-threads = 2 }
